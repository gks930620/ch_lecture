<!DOCTYPE html>
<!--
  실습 06: 테이블 태그 (강의노트 1.7)
  ------------------------------------------------
  강의 포인트
  - 테이블은 '데이터 표현'용이지 '레이아웃'용이 아니다
  - thead/tbody/tfoot로 구조화하면 가독성이 좋아진다
  - colspan(열 병합) / rowspan(행 병합)
  참고: 경계선이 보이도록 최소한의 style만 넣었습니다. 꾸미기(CSS)는 2장에서 배웁니다.
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실습 06 - 테이블 태그</title>
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid #333; padding: 8px 14px; text-align: center; }
        thead { background: #eef; }
        tfoot { background: #efe; font-weight: bold; }
    </style>
</head>
<body>
    <h1>테이블 태그 실습</h1>

    <h2>기본 구조 (thead / tbody / tfoot)</h2>
    <table>
        <thead>
            <tr>
                <th>이름</th>
                <th>과목</th>
                <th>점수</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>홍길동</td>
                <td>수학</td>
                <td>90</td>
            </tr>
            <tr>
                <td>김영희</td>
                <td>영어</td>
                <td>85</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">평균</td>   <!-- 열 2칸 병합 -->
                <td>87.5</td>
            </tr>
        </tfoot>
    </table>

    <h2>colspan / rowspan 병합</h2>
    <table>
        <tr>
            <th rowspan="2">부서</th>       <!-- 행 2칸 병합 -->
            <th colspan="2">인원</th>        <!-- 열 2칸 병합 -->
        </tr>
        <tr>
            <th>정규직</th>
            <th>인턴</th>
        </tr>
        <tr>
            <td>개발팀</td>
            <td>5</td>
            <td>2</td>
        </tr>
    </table>
</body>
</html>
