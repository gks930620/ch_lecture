<!DOCTYPE html>
<!--
  실습 02: 텍스트 태그 (강의노트 1.3)
  ------------------------------------------------
  강의 포인트
  - h1~h6는 '크기'가 아니라 '중요도(제목 계층)'를 나타낸다. h1은 페이지당 하나 권장.
  - strong/em = 의미가 분명한 강조, b/i = 의미가 약한 강조(시선 끌기·다른 결)
  실습 방법
  - h1~h6를 순서대로 보며 계층 구조를 확인하세요.
  - strong과 b, em과 i가 화면상 비슷해 보여도 '의미'가 다름을 기억하세요.
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실습 02 - 텍스트 태그</title>
</head>
<body>
    <h1>h1: 페이지의 주제 (가장 중요)</h1>
    <h2>h2: 큰 섹션 제목</h2>
    <h3>h3: 하위 섹션</h3>
    <h4>h4</h4>
    <h5>h5</h5>
    <h6>h6: 가장 낮은 단계</h6>

    <hr>

    <h2>문단(p) 태그</h2>
    <p>하나의 문단입니다. p 태그는 위아래로 자동 여백이 생깁니다.</p>
    <p>이건 다른 문단입니다. 문단마다 줄이 나뉘죠.</p>

    <hr>

    <h2>강조 태그 비교</h2>
    <p>
        오늘은 <strong>정말 중요한</strong> 공지가 있습니다.  <!-- 의미상 중요 -->
        그리고 <em>이 부분을 특히</em> 주의 깊게 보세요.        <!-- 의미상 강조 -->
    </p>
    <p>
        <b>여기는 시선만 끄는 굵은 글씨</b>이고,               <!-- 약한 의미 -->
        <i>여기는 전문용어나 외래어처럼 결이 다른 글씨</i>입니다.  <!-- 약한 의미 -->
    </p>
    <p>👉 화면은 비슷해도, "강조하려면 의미가 분명한 strong/em을 먼저" 고르세요.</p>
</body>
</html>
