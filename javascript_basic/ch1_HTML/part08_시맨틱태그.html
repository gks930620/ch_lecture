<!DOCTYPE html>
<!--
  실습 08: 시맨틱 태그 (강의노트 1.10)
  ------------------------------------------------
  강의 포인트
  - 시맨틱 = '의미 있는'. 태그 이름만 봐도 그 구역의 용도를 알 수 있다.
  - div로도 똑같이 만들 수 있지만, 시맨틱 태그가 SEO·접근성·가독성에 유리
  참고: 각 구역이 눈에 보이도록 최소한의 테두리 style만 넣었습니다(꾸미기는 2장 CSS).
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실습 08 - 시맨틱 태그</title>
    <style>
        header, nav, main, article, aside, footer {
            border: 2px solid #4f46e5; padding: 10px; margin: 6px 0;
        }
        nav { background: #ede9fe; }
        aside { background: #fef3c7; }
        footer { background: #e2e8f0; }
    </style>
</head>
<body>
    <!-- 아래 구조를 div로만 짜면 '이름'만 봐서는 용도를 알 수 없습니다 -->
    <header>
        <h1>🌐 나의 블로그</h1>
        <p>시맨틱 태그로 짠 페이지</p>
    </header>

    <nav>
        <a href="#">홈</a> |
        <a href="#">소개</a> |
        <a href="#">글 목록</a>
    </nav>

    <main>
        <article>
            <h2>article: 독립적으로 배포 가능한 글</h2>
            <p>이 글 하나만 떼어내 다른 곳에 공유해도 말이 되는 단위입니다.</p>
        </article>

        <aside>
            <h3>aside: 부가 정보(사이드바)</h3>
            <p>본문과 직접 관련은 적은 광고·추천 링크 등을 넣습니다.</p>
        </aside>
    </main>

    <footer>
        <p>© 2026 나의 블로그 · 연락처: hello@example.com</p>
    </footer>
</body>
</html>
