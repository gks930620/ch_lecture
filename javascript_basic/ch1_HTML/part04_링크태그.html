<!DOCTYPE html>
<!--
  실습 04: 링크 태그 (강의노트 1.5)
  ------------------------------------------------
  강의 포인트
  - 웹의 핵심은 '연결'(하이퍼링크)
  - target="_blank"로 새 창을 열 때는 rel="noopener" 습관을 들이기
    (noopener: 새 창이 원래 창을 못 건드리게 / noreferrer: 어디서 왔는지 정보도 숨김)
  - 같은 페이지 안 이동은 #id(앵커)로 한다
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실습 04 - 링크 태그</title>
</head>
<body>
    <h1 id="top">링크 태그 실습</h1>

    <h2>1. 기본 링크</h2>
    <p><a href="https://www.google.com">구글로 이동 (현재 창)</a></p>

    <h2>2. 상대경로 vs 절대경로</h2>
    <ul>
        <!-- 절대경로: http(s)://로 시작하는 '전체 주소' -->
        <li><a href="https://www.google.com">절대경로 (전체 주소)</a></li>
        <!-- 상대경로: 지금 이 파일 기준 위치. 같은 폴더의 파일로 이동 -->
        <li><a href="part03_목록태그.html">상대경로 (같은 폴더의 다른 실습 파일로 이동)</a></li>
    </ul>

    <h2>3. 새 창으로 열기</h2>
    <p>
        <a href="https://developer.mozilla.org/ko/" target="_blank" rel="noopener">
            MDN 새 창으로 열기 (noopener 적용)
        </a>
    </p>

    <h2>4. 페이지 내 이동 (앵커)</h2>
    <p><a href="#section-bottom">맨 아래 섹션으로 점프 ↓</a></p>

    <h2>5. 특수 링크</h2>
    <ul>
        <li><a href="mailto:hello@example.com">이메일 보내기</a></li>
        <li><a href="tel:010-1234-5678">전화 걸기</a></li>
    </ul>

    <!-- 화면을 길게 만들어 앵커 이동을 체감하기 위한 여백 -->
    <div style="height: 600px;"></div>

    <h2 id="section-bottom">여기가 맨 아래 섹션입니다 🎯</h2>
    <p><a href="#top">맨 위로 돌아가기 ↑</a></p>
</body>
</html>
