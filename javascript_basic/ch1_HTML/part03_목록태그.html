<!DOCTYPE html>
<!--
  실습 03: 목록 태그 (강의노트 1.4)
  ------------------------------------------------
  강의 포인트
  - 순서가 중요하면 ol(번호), 중요하지 않으면 ul(점)
  - 목록끼리 중첩(nested)할 수 있다
  - type / start 속성으로 번호 스타일과 시작값을 바꿀 수 있다
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실습 03 - 목록 태그</title>
</head>
<body>
    <h1>목록 태그 실습</h1>

    <h2>ul - 순서 없는 목록 (쇼핑 목록)</h2>
    <ul>
        <li>커피</li>
        <li>홍차</li>
        <li>우유</li>
    </ul>

    <h2>ol - 순서 있는 목록 (레시피)</h2>
    <ol>
        <li>재료 준비</li>
        <li>물 끓이기</li>
        <li>재료 넣기</li>
    </ol>

    <h2>중첩 목록 (메뉴 안의 하위 메뉴)</h2>
    <ul>
        <li>음료
            <ul>
                <li>아메리카노</li>
                <li>카페라떼</li>
            </ul>
        </li>
        <li>디저트
            <ul>
                <li>치즈케이크</li>
                <li>마카롱</li>
            </ul>
        </li>
    </ul>

    <h2>type / start 속성</h2>
    <ol type="A">          <!-- A, B, C... -->
        <li>대문자 알파벳</li>
        <li>순서</li>
    </ol>
    <ol start="5">         <!-- 5번부터 시작 -->
        <li>다섯 번째부터</li>
        <li>시작합니다</li>
    </ol>
</body>
</html>
