<!DOCTYPE html>
<!--
  실습 01: HTML 기본 구조 (강의노트 1.2)
  ------------------------------------------------
  강의 포인트
  - 모든 HTML 문서는 이 5줄짜리 뼈대에서 시작한다: DOCTYPE / html / head / body
  - head = 화면에 안 보이는 '정보', body = 화면에 보이는 '내용'
  실습 방법
  - 이 파일을 브라우저로 열고, 탭 제목과 화면 내용을 비교해 보세요.
  - <title>과 <h1>의 글자를 각각 바꿔보면 어디에 나타나는지 알 수 있습니다.
-->
<html lang="ko">              <!-- 문서 언어: 한국어 (SEO·접근성) -->
<head>
    <meta charset="UTF-8">                 <!-- 문자 인코딩: 한글 깨짐 방지 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 대응 -->
    <title>실습 01 - HTML 기본 구조</title>  <!-- 브라우저 '탭'에 표시되는 제목 -->
</head>
<body>
    <!-- 여기부터가 실제 화면에 보이는 부분입니다 -->
    <h1>안녕하세요! 첫 HTML 문서입니다 👋</h1>
    <p>이 문장은 body 안에 있어서 화면에 보입니다.</p>
    <p>반면 title은 화면이 아니라 <strong>브라우저 탭</strong>에 나타납니다.</p>

    <hr>
    <p>💡 확인해 보기: 브라우저 탭의 제목과 이 화면의 제목이 서로 다르죠?</p>
</body>
</html>
