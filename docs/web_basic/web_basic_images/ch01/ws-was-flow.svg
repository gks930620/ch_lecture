<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#374151"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">웹서버(WS) vs WAS — 정적/동적 요청 처리</text>

  <!-- Client -->
  <rect x="30" y="150" width="120" height="70" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="180" text-anchor="middle" font-weight="bold" fill="#1e40af">클라이언트</text>
  <text x="90" y="202" text-anchor="middle" font-size="12" fill="#1e40af">(브라우저)</text>

  <!-- Web Server -->
  <rect x="290" y="150" width="150" height="70" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="365" y="178" text-anchor="middle" font-weight="bold" fill="#065f46">웹서버(WS)</text>
  <text x="365" y="200" text-anchor="middle" font-size="12" fill="#065f46">Nginx / Apache</text>

  <!-- WAS -->
  <rect x="580" y="150" width="150" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="655" y="172" text-anchor="middle" font-weight="bold" fill="#92400e">WAS</text>
  <text x="655" y="192" text-anchor="middle" font-size="12" fill="#92400e">Tomcat(서블릿/JSP)</text>
  <text x="655" y="210" text-anchor="middle" font-size="11" fill="#92400e">비즈니스 로직 실행</text>

  <!-- Static box -->
  <rect x="290" y="255" width="150" height="46" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="365" y="283" text-anchor="middle" font-size="12" fill="#166534">정적 파일(HTML/CSS/JS/이미지)</text>

  <!-- DB -->
  <rect x="600" y="255" width="110" height="46" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="655" y="283" text-anchor="middle" font-size="12" fill="#6d28d9">DB / 외부 API</text>

  <!-- Client -> WS -->
  <line x1="150" y1="175" x2="288" y2="175" stroke="#374151" stroke-width="2" marker-end="url(#a1)"/>
  <text x="219" y="166" text-anchor="middle" font-size="12" fill="#374151">요청</text>

  <!-- WS static path -->
  <line x1="365" y1="220" x2="365" y2="253" stroke="#10b981" stroke-width="2" marker-end="url(#a1)"/>
  <text x="450" y="245" text-anchor="middle" font-size="12" fill="#065f46">① 정적이면 WS가 직접 응답</text>

  <!-- WS -> WAS dynamic -->
  <line x1="440" y1="175" x2="578" y2="175" stroke="#f59e0b" stroke-width="2" marker-end="url(#a1)"/>
  <text x="509" y="166" text-anchor="middle" font-size="12" fill="#92400e">② 동적이면 위임</text>

  <!-- WAS -> DB -->
  <line x1="655" y1="220" x2="655" y2="253" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a1)"/>

  <!-- return arrow -->
  <line x1="288" y1="205" x2="152" y2="205" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a1)"/>
  <text x="219" y="224" text-anchor="middle" font-size="11" fill="#6b7280">응답</text>

  <text x="380" y="345" text-anchor="middle" font-size="12" fill="#6b7280">정적 자원은 웹서버가 빠르게 서빙하고, 동적 자원만 WAS가 처리하도록 나누는 것이 일반적인 구조입니다.</text>
</svg>
