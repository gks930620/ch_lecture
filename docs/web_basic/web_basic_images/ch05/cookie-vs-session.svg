<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14">
  <defs>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#374151"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Cookie(브라우저 저장) vs Session(서버 저장)</text>

  <!-- Browser -->
  <rect x="40" y="90" width="230" height="250" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="116" text-anchor="middle" font-weight="bold" fill="#1e40af">브라우저 (클라이언트)</text>

  <rect x="65" y="135" width="180" height="70" rx="6" fill="#ffffff" stroke="#60a5fa"/>
  <text x="155" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">🍪 쿠키 저장소</text>
  <text x="155" y="180" text-anchor="middle" font-size="11" fill="#374151">hideNotice=true</text>
  <text x="155" y="196" text-anchor="middle" font-size="11" fill="#374151">JSESSIONID=3F2A...</text>

  <rect x="65" y="225" width="180" height="90" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="155" y="247" text-anchor="middle" font-size="12" fill="#9a3412">쿠키 = 데이터가</text>
  <text x="155" y="265" text-anchor="middle" font-size="12" fill="#9a3412">브라우저에 직접 저장</text>
  <text x="155" y="285" text-anchor="middle" font-size="11" fill="#9a3412">(4KB 제한, 탈취 위험)</text>
  <text x="155" y="303" text-anchor="middle" font-size="11" fill="#9a3412">HttpOnly/Secure로 보호</text>

  <!-- Server -->
  <rect x="490" y="90" width="230" height="250" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="605" y="116" text-anchor="middle" font-weight="bold" fill="#065f46">서버 (WAS)</text>

  <rect x="515" y="135" width="180" height="180" rx="6" fill="#ffffff" stroke="#34d399"/>
  <text x="605" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">세션 저장소 (Map)</text>
  <text x="605" y="182" text-anchor="middle" font-size="11" fill="#374151">"3F2A..." → {</text>
  <text x="605" y="200" text-anchor="middle" font-size="11" fill="#374151">loginUser: "admin"</text>
  <text x="605" y="218" text-anchor="middle" font-size="11" fill="#374151">role: "USER" }</text>
  <line x1="530" y1="232" x2="680" y2="232" stroke="#d1fae5"/>
  <text x="605" y="255" text-anchor="middle" font-size="11" fill="#065f46">세션 = 실제 데이터는</text>
  <text x="605" y="273" text-anchor="middle" font-size="11" fill="#065f46">서버 메모리에 보관</text>
  <text x="605" y="295" text-anchor="middle" font-size="11" fill="#065f46">JSESSIONID로만 식별</text>

  <!-- arrows -->
  <line x1="270" y1="170" x2="488" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#ac)"/>
  <text x="379" y="160" text-anchor="middle" font-size="11" fill="#374151">요청마다 JSESSIONID 쿠키 자동 전송</text>

  <line x1="488" y1="205" x2="272" y2="205" stroke="#10b981" stroke-width="2" marker-end="url(#ac)"/>
  <text x="379" y="222" text-anchor="middle" font-size="11" fill="#065f46">최초 요청 시 Set-Cookie: JSESSIONID</text>

  <text x="380" y="368" text-anchor="middle" font-size="12" fill="#6b7280">핵심: 세션의 실제 값은 서버에 있고, 브라우저는 열쇠(JSESSIONID) 쿠키만 들고 다닌다.</text>
</svg>
