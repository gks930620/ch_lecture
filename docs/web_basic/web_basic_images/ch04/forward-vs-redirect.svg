<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#374151"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Forward vs Redirect</text>

  <!-- ===== Forward ===== -->
  <text x="200" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">Forward (서버 내부 이동)</text>
  <rect x="40" y="80" width="120" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="115" text-anchor="middle" font-weight="bold" fill="#1e40af">브라우저</text>

  <rect x="250" y="75" width="220" height="150" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="360" y="97" text-anchor="middle" font-size="12" fill="#065f46">서버(WAS) 내부</text>
  <rect x="270" y="108" width="80" height="42" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="310" y="134" text-anchor="middle" font-size="12" fill="#065f46">서블릿 A</text>
  <rect x="370" y="108" width="80" height="42" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="410" y="134" text-anchor="middle" font-size="12" fill="#065f46">JSP B</text>
  <line x1="350" y1="129" x2="368" y2="129" stroke="#10b981" stroke-width="2" marker-end="url(#ar)"/>
  <text x="360" y="175" text-anchor="middle" font-size="11" fill="#065f46">forward(req,resp)</text>
  <text x="360" y="192" text-anchor="middle" font-size="11" fill="#065f46">request/response 그대로 유지</text>

  <line x1="160" y1="105" x2="248" y2="105" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="204" y="97" text-anchor="middle" font-size="11" fill="#374151">요청 1번</text>
  <line x1="248" y1="128" x2="162" y2="128" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <text x="204" y="145" text-anchor="middle" font-size="11" fill="#6b7280">응답 1번</text>
  <text x="100" y="165" text-anchor="middle" font-size="11" fill="#dc2626">주소창 URL 그대로</text>

  <!-- ===== Redirect ===== -->
  <text x="200" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Redirect (브라우저 재요청)</text>
  <rect x="40" y="280" width="120" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="315" text-anchor="middle" font-weight="bold" fill="#1e40af">브라우저</text>

  <rect x="250" y="278" width="120" height="52" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="310" y="309" text-anchor="middle" font-size="12" fill="#92400e">서블릿 A</text>
  <rect x="250" y="345" width="120" height="52" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="310" y="376" text-anchor="middle" font-size="12" fill="#92400e">결과 페이지 B</text>

  <line x1="160" y1="298" x2="248" y2="298" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="204" y="290" text-anchor="middle" font-size="11" fill="#374151">요청 1</text>
  <line x1="248" y1="315" x2="162" y2="315" stroke="#f59e0b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="204" y="332" text-anchor="middle" font-size="10" fill="#92400e">302 + Location</text>
  <line x1="160" y1="371" x2="248" y2="371" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="204" y="363" text-anchor="middle" font-size="11" fill="#374151">요청 2 (새 요청)</text>
  <text x="100" y="365" text-anchor="middle" font-size="11" fill="#dc2626">주소창 URL 변경</text>

  <text x="380" y="415" text-anchor="middle" font-size="12" fill="#6b7280">Forward는 요청 1번·request 유지, Redirect는 요청 2번·request 소멸(중복 제출 방지: PRG 패턴).</text>
</svg>
