<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="920" height="640" fill="#ffffff"/>

  <!-- ===== Panel 1: CORS block (preflight) ===== -->
  <text x="30" y="36" font-size="19" font-weight="bold" fill="#111827">① CORS 차단 — 브라우저 JS가 공공API에 직접 요청하면?</text>

  <!-- browser box -->
  <rect x="40" y="70" width="200" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="100" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">브라우저</text>
  <text x="140" y="124" font-size="13" text-anchor="middle" fill="#374151">a-오리진 사이트의</text>
  <text x="140" y="143" font-size="13" text-anchor="middle" fill="#374151">JavaScript (fetch/ajax)</text>

  <!-- api server box -->
  <rect x="660" y="70" width="200" height="120" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="760" y="100" font-size="15" font-weight="bold" text-anchor="middle" fill="#b91c1c">공공API 서버</text>
  <text x="760" y="124" font-size="13" text-anchor="middle" fill="#374151">허용 오리진 목록에</text>
  <text x="760" y="143" font-size="13" text-anchor="middle" fill="#374151">a-오리진 없음</text>

  <!-- preflight arrows -->
  <line x1="250" y1="100" x2="650" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="92" font-size="13" text-anchor="middle" fill="#374151">1. Preflight(OPTIONS): "a-오리진인데 요청해도 돼?"</text>

  <line x1="650" y1="135" x2="250" y2="135" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="128" font-size="13" text-anchor="middle" fill="#374151">2. 응답: "허용 목록에 a-오리진 없음"</text>

  <line x1="250" y1="170" x2="440" y2="170" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowRed)"/>
  <text x="460" y="175" font-size="13.5" font-weight="bold" fill="#dc2626">3. 브라우저가 본 요청을 차단! (JS는 에러만 받음)</text>

  <text x="40" y="222" font-size="12.5" fill="#6b7280">※ 서버가 막는 게 아니라 "브라우저"가 막는다. GET/POST 등 Simple Request는 본 요청이 가긴 하지만 응답을 JS에 안 넘겨줌.</text>

  <!-- divider -->
  <line x1="30" y1="250" x2="890" y2="250" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ===== Panel 2: Proxy solution ===== -->
  <text x="30" y="288" font-size="19" font-weight="bold" fill="#111827">② 해결 — 내 Spring 서버를 프록시로 사용 (이 프로젝트 방식)</text>

  <!-- browser box -->
  <rect x="40" y="330" width="200" height="130" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="360" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">브라우저</text>
  <text x="140" y="384" font-size="13" text-anchor="middle" fill="#374151">api.html의 JS</text>
  <text x="140" y="403" font-size="12.5" text-anchor="middle" fill="#6b7280">fetch('/api/proxy/...')</text>
  <text x="140" y="422" font-size="12.5" text-anchor="middle" fill="#16a34a">같은 오리진 → CORS 문제 X</text>

  <!-- my server box -->
  <rect x="360" y="330" width="200" height="130" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="460" y="360" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">내 Spring 서버</text>
  <text x="460" y="384" font-size="13" text-anchor="middle" fill="#374151">ApiProxyController</text>
  <text x="460" y="403" font-size="12.5" text-anchor="middle" fill="#6b7280">RestClient로</text>
  <text x="460" y="422" font-size="12.5" text-anchor="middle" fill="#6b7280">서버 → 서버 호출</text>

  <!-- api server box -->
  <rect x="680" y="330" width="200" height="130" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="780" y="360" font-size="15" font-weight="bold" text-anchor="middle" fill="#c2410c">공공API 서버</text>
  <text x="780" y="384" font-size="13" text-anchor="middle" fill="#374151">서버끼리 요청은</text>
  <text x="780" y="403" font-size="13" text-anchor="middle" fill="#374151">CORS와 무관</text>
  <text x="780" y="422" font-size="12.5" text-anchor="middle" fill="#6b7280">(대신 인증키로 통제)</text>

  <!-- arrows -->
  <line x1="250" y1="375" x2="350" y2="375" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="300" y="365" font-size="12.5" text-anchor="middle" fill="#16a34a">1. 요청</text>
  <line x1="350" y1="415" x2="250" y2="415" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="300" y="437" font-size="12.5" text-anchor="middle" fill="#16a34a">4. JSON 응답</text>

  <line x1="570" y1="375" x2="670" y2="375" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="620" y="365" font-size="12.5" text-anchor="middle" fill="#c2410c">2. API 호출</text>
  <line x1="670" y1="415" x2="570" y2="415" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="620" y="437" font-size="12.5" text-anchor="middle" fill="#c2410c">3. 데이터</text>

  <!-- summary -->
  <rect x="40" y="500" width="840" height="110" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="60" y="530" font-size="14.5" font-weight="bold" fill="#111827">핵심 정리</text>
  <text x="60" y="556" font-size="13.5" fill="#374151">· CORS는 "브라우저가 JS의 다른 오리진 요청을 막는 것" — 서버끼리의 요청과는 전혀 상관없다.</text>
  <text x="60" y="578" font-size="13.5" fill="#374151">· 그래서 브라우저 → 내 서버(같은 오리진) → 공공API(서버 대 서버) 로 우회하면 CORS 문제가 사라진다.</text>
  <text x="60" y="600" font-size="13.5" fill="#374151">· 서버가 서버의 요청을 통제하는 수단은 CORS가 아니라 인증키(API Key)·IP 제한 등이다.</text>
</svg>
