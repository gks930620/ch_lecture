<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Arial">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1100" height="560" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-size="30" fill="#0f172a">JVM Memory: Stack, Heap, GC</text>

  <!-- Stack region -->
  <rect x="60" y="100" width="380" height="400" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="132" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a8a">Stack (per thread)</text>

  <!-- method() frame (top of stack) -->
  <rect x="90" y="155" width="320" height="110" rx="10" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="250" y="182" text-anchor="middle" font-size="15" fill="#1e3a8a">method() frame</text>
  <rect x="120" y="196" width="150" height="40" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="195" y="221" text-anchor="middle" font-size="15" fill="#1e3a8a" font-family="Consolas, monospace">String s</text>

  <!-- main() frame (bottom of stack) -->
  <rect x="90" y="290" width="320" height="180" rx="10" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="250" y="317" text-anchor="middle" font-size="15" fill="#1e3a8a">main() frame</text>
  <rect x="120" y="335" width="150" height="40" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="195" y="360" text-anchor="middle" font-size="15" fill="#1e3a8a" font-family="Consolas, monospace">User u</text>
  <rect x="120" y="390" width="150" height="40" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="195" y="415" text-anchor="middle" font-size="15" fill="#1e3a8a" font-family="Consolas, monospace">int n = 5</text>
  <text x="340" y="414" text-anchor="middle" font-size="11" fill="#1e3a8a">value in stack</text>

  <!-- Heap region -->
  <rect x="560" y="100" width="480" height="400" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="800" y="132" text-anchor="middle" font-size="20" font-weight="bold" fill="#166534">Heap (shared)</text>

  <rect x="610" y="170" width="190" height="70" rx="10" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="705" y="198" text-anchor="middle" font-size="15" fill="#166534">String object</text>
  <text x="705" y="222" text-anchor="middle" font-size="13" fill="#166534" font-family="Consolas, monospace">"hello"</text>

  <rect x="610" y="290" width="190" height="70" rx="10" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="705" y="318" text-anchor="middle" font-size="15" fill="#166534">User object</text>
  <text x="705" y="342" text-anchor="middle" font-size="13" fill="#166534" font-family="Consolas, monospace">name = "Kim"</text>

  <!-- Unreachable object -->
  <rect x="840" y="170" width="170" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="6 4"/>
  <text x="925" y="198" text-anchor="middle" font-size="14" fill="#991b1b">Orphan object</text>
  <text x="925" y="220" text-anchor="middle" font-size="12" fill="#991b1b">no reference</text>
  <line x1="990" y1="152" x2="1020" y2="180" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="1020" y1="152" x2="990" y2="180" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>

  <line x1="925" y1="308" x2="925" y2="248" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="925" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">GC collects</text>
  <text x="925" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">unreachable objects</text>

  <!-- reference arrows: stack variables to heap objects -->
  <line x1="272" y1="216" x2="606" y2="206" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="272" y1="355" x2="606" y2="324" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="500" y="196" text-anchor="middle" font-size="13" fill="#1e3a8a">reference</text>

  <text x="550" y="538" text-anchor="middle" font-size="16" fill="#334155">Stack holds primitives and references; objects live in the Heap</text>
</svg>
