<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker>
  </defs>

  <rect width="1100" height="600" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#0f172a">Lambda &#8596; Method Reference</text>

  <text x="270" y="82" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e3a8a">Lambda</text>
  <text x="830" y="82" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#166534">Method Reference</text>

  <!-- row 1 -->
  <text x="70" y="114" font-family="Arial" font-size="15" font-weight="bold" fill="#334155">1. static method</text>
  <rect x="70" y="124" width="400" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="157" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#1e3a8a">s -&gt; Integer.parseInt(s)</text>
  <rect x="630" y="124" width="400" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="830" y="157" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#166534">Integer::parseInt</text>
  <line x1="490" y1="145" x2="612" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="610" y1="155" x2="488" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- row 2 -->
  <text x="70" y="232" font-family="Arial" font-size="15" font-weight="bold" fill="#334155">2. instance method of a particular object</text>
  <rect x="70" y="242" width="400" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="275" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#1e3a8a">s -&gt; prefix.startsWith(s)</text>
  <rect x="630" y="242" width="400" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="830" y="275" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#166534">prefix::startsWith</text>
  <line x1="490" y1="263" x2="612" y2="263" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="610" y1="273" x2="488" y2="273" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- row 3 -->
  <text x="70" y="350" font-family="Arial" font-size="15" font-weight="bold" fill="#334155">3. instance method &#8212; 1st param becomes the receiver</text>
  <rect x="70" y="360" width="400" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="393" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#1e3a8a">s -&gt; s.length()</text>
  <rect x="630" y="360" width="400" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="830" y="393" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#166534">String::length</text>
  <line x1="490" y1="381" x2="612" y2="381" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="610" y1="391" x2="488" y2="391" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <path d="M200,416 C260,455 720,455 785,418" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="492" y="466" text-anchor="middle" font-family="Arial" font-size="13" font-style="italic" fill="#92400e">s becomes the receiver (String)</text>

  <!-- row 4 -->
  <text x="70" y="494" font-family="Arial" font-size="15" font-weight="bold" fill="#334155">4. constructor</text>
  <rect x="70" y="504" width="400" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="537" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#1e3a8a">() -&gt; new ArrayList&lt;&gt;()</text>
  <rect x="630" y="504" width="400" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="830" y="537" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#166534">ArrayList::new</text>
  <line x1="490" y1="525" x2="612" y2="525" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="610" y1="535" x2="488" y2="535" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
</svg>
