<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
  </defs>

  <rect width="1100" height="560" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="30" fill="#0f172a" font-weight="bold">Reference Type = Visible Window</text>

  <!-- Heap container -->
  <rect x="390" y="80" width="320" height="250" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="550" y="105" text-anchor="middle" font-family="Arial" font-size="15" fill="#64748b" font-weight="bold">Heap</text>

  <!-- Dog object -->
  <rect x="420" y="118" width="260" height="190" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="148" text-anchor="middle" font-family="Arial" font-size="19" fill="#166534" font-weight="bold">Dog object</text>
  <line x1="440" y1="160" x2="660" y2="160" stroke="#16a34a" stroke-width="1"/>
  <rect x="440" y="175" width="220" height="48" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="550" y="199" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#166534" font-weight="bold">eat()</text>
  <text x="550" y="216" text-anchor="middle" font-family="Arial" font-size="12" fill="#166534">from Animal</text>
  <rect x="440" y="238" width="220" height="48" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="550" y="262" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#166534" font-weight="bold">bark()</text>
  <text x="550" y="279" text-anchor="middle" font-family="Arial" font-size="12" fill="#166534">Dog only</text>

  <!-- Left reference: Animal a -->
  <rect x="60" y="155" width="260" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#1e3a8a" font-weight="bold">Animal a</text>
  <text x="190" y="218" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">narrow window</text>
  <text x="190" y="248" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a" font-weight="bold">sees: eat() only</text>
  <line x1="322" y1="215" x2="414" y2="215" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Right reference: Dog d -->
  <rect x="780" y="155" width="260" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="910" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#166534" font-weight="bold">Dog d</text>
  <text x="910" y="218" text-anchor="middle" font-family="Arial" font-size="14" fill="#166534">full window</text>
  <text x="910" y="248" text-anchor="middle" font-family="Arial" font-size="14" fill="#166534" font-weight="bold">sees: eat() + bark()</text>
  <line x1="778" y1="215" x2="686" y2="215" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Failure case -->
  <rect x="100" y="375" width="900" height="150" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="550" y="408" text-anchor="middle" font-family="Arial" font-size="18" fill="#991b1b" font-weight="bold">Wrong downcast</text>
  <text x="550" y="448" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#991b1b">Animal x = new Cat();   Dog d = (Dog) x;</text>
  <text x="550" y="492" text-anchor="middle" font-family="Arial" font-size="16" fill="#991b1b" font-weight="bold">runtime ClassCastException — actual object is a Cat</text>
</svg>
