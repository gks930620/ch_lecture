<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1100" height="560" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="30" fill="#0f172a" font-weight="bold">Primitive vs Reference Variable</text>

  <!-- Left panel: primitive (blue) -->
  <rect x="40" y="80" width="490" height="390" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="285" y="115" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1e3a8a">Primitive — box holds the VALUE</text>
  <rect x="135" y="135" width="300" height="42" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="285" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#1e3a8a">int age = 25;</text>
  <!-- variable box -->
  <rect x="205" y="225" width="160" height="110" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="210" y="213" width="44" height="24" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="232" y="230" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e3a8a">int</text>
  <text x="285" y="298" text-anchor="middle" font-family="Arial" font-size="42" font-weight="bold" fill="#1e3a8a">25</text>
  <text x="285" y="365" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#1e3a8a">age</text>
  <text x="285" y="415" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">the value lives inside the variable</text>

  <!-- Right panel: reference (green) -->
  <rect x="570" y="80" width="490" height="390" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="815" y="115" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#166534">Reference — box holds an ADDRESS</text>
  <rect x="640" y="135" width="350" height="42" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="815" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#166534">String name = "kim";</text>
  <!-- heap band -->
  <rect x="790" y="230" width="250" height="170" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="915" y="256" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#64748b">Heap</text>
  <!-- variable box -->
  <rect x="600" y="270" width="130" height="80" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="665" cy="302" r="7" fill="#16a34a"/>
  <text x="665" y="332" text-anchor="middle" font-family="Arial" font-size="13" fill="#166534">address</text>
  <text x="665" y="375" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#166534">name</text>
  <!-- object box in heap -->
  <rect x="815" y="278" width="200" height="90" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="915" y="305" text-anchor="middle" font-family="Arial" font-size="14" fill="#166534">String object</text>
  <text x="915" y="345" text-anchor="middle" font-family="Consolas, monospace" font-size="24" font-weight="bold" fill="#166534">"kim"</text>
  <!-- arrow from variable to object -->
  <line x1="672" y1="302" x2="808" y2="315" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="815" y="440" text-anchor="middle" font-family="Arial" font-size="16" fill="#166534">the variable only points to the object</text>

  <!-- bottom note (gray) -->
  <rect x="130" y="495" width="840" height="44" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="550" y="523" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">Arrays work the same way: int[] scores also holds a reference, not the values</text>
</svg>
