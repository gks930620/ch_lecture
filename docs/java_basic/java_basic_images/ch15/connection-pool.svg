<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580">
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
  </defs>

  <rect width="1100" height="580" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#0f172a">DriverManager vs Connection Pool</text>

  <!-- left panel: DriverManager -->
  <rect x="40" y="80" width="490" height="470" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="285" y="115" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#991b1b">DriverManager &#8212; every request</text>

  <rect x="70" y="150" width="130" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="181" text-anchor="middle" font-family="Arial" font-size="15" fill="#1e3a8a">Request 1</text>
  <rect x="70" y="260" width="130" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="291" text-anchor="middle" font-family="Arial" font-size="15" fill="#1e3a8a">Request 2</text>
  <rect x="70" y="370" width="130" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="401" text-anchor="middle" font-family="Arial" font-size="15" fill="#1e3a8a">Request 3</text>

  <rect x="390" y="140" width="110" height="280" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="445" y="288" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#334155">DB</text>

  <line x1="204" y1="175" x2="386" y2="175" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="295" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">open &#8594; use &#8594; close</text>
  <line x1="204" y1="285" x2="386" y2="285" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="295" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">open &#8594; use &#8594; close</text>
  <line x1="204" y1="395" x2="386" y2="395" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="295" y="384" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">open &#8594; use &#8594; close</text>

  <text x="285" y="470" text-anchor="middle" font-family="Arial" font-size="14" fill="#991b1b">3 requests = 3 brand-new connections</text>
  <text x="285" y="505" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#991b1b">TCP + auth handshake every time (slow)</text>

  <!-- right panel: Connection Pool -->
  <rect x="570" y="80" width="490" height="470" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="815" y="115" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#166534">Connection Pool</text>

  <text x="665" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">borrow &#8594; use &#8594; return</text>

  <rect x="590" y="150" width="115" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="648" y="181" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Request 1</text>
  <rect x="590" y="260" width="115" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="648" y="291" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Request 2</text>
  <rect x="590" y="370" width="115" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="648" y="401" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Request 3</text>

  <!-- borrow / return double arrows -->
  <line x1="709" y1="170" x2="756" y2="170" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="758" y1="182" x2="711" y2="182" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="709" y1="280" x2="756" y2="280" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="758" y1="292" x2="711" y2="292" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="709" y1="390" x2="756" y2="390" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="758" y1="402" x2="711" y2="402" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- pool box -->
  <rect x="760" y="140" width="130" height="280" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="825" y="168" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#166534">Pool</text>
  <rect x="775" y="185" width="100" height="40" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="825" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">conn 1</text>
  <rect x="775" y="240" width="100" height="40" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="825" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">conn 2</text>
  <rect x="775" y="295" width="100" height="40" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="825" y="320" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">conn 3</text>
  <text x="825" y="365" text-anchor="middle" font-family="Arial" font-size="12" fill="#166534">created once</text>
  <text x="825" y="383" text-anchor="middle" font-family="Arial" font-size="12" fill="#166534">at startup</text>

  <!-- DB -->
  <rect x="950" y="200" width="90" height="160" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="995" y="288" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#334155">DB</text>

  <line x1="892" y1="240" x2="948" y2="240" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="892" y1="280" x2="948" y2="280" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="892" y1="320" x2="948" y2="320" stroke="#16a34a" stroke-width="2.5"/>

  <text x="900" y="447" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#166534">physical connections stay open (reused)</text>
  <text x="815" y="505" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#166534">handshake paid once at startup &#8212; fast requests</text>
</svg>
