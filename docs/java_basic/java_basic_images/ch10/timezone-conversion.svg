<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  </defs>

  <rect width="1100" height="480" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="30" fill="#0f172a" font-weight="bold">One Instant, Different Time Zones</text>

  <!-- Instant (center) -->
  <rect x="400" y="130" width="300" height="120" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="550" y="165" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155" font-weight="bold">Instant</text>
  <text x="550" y="196" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#334155">2026-04-09T00:00:00Z</text>
  <text x="550" y="220" text-anchor="middle" font-family="Arial" font-size="13" fill="#334155">(UTC)</text>
  <text x="550" y="282" text-anchor="middle" font-family="Arial" font-size="15" fill="#64748b" font-style="italic">the same moment</text>

  <!-- Seoul -->
  <rect x="70" y="130" width="260" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="165" text-anchor="middle" font-family="Arial" font-size="18" fill="#166534" font-weight="bold">Asia/Seoul</text>
  <text x="200" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#166534">2026-04-09 09:00</text>
  <text x="200" y="224" text-anchor="middle" font-family="Arial" font-size="13" fill="#166534">UTC+9</text>
  <line x1="398" y1="190" x2="336" y2="190" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- New York -->
  <rect x="770" y="130" width="260" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="900" y="165" text-anchor="middle" font-family="Arial" font-size="17" fill="#1e3a8a" font-weight="bold">America/New_York</text>
  <text x="900" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#1e3a8a">2026-04-08 20:00</text>
  <text x="900" y="224" text-anchor="middle" font-family="Arial" font-size="13" fill="#dc2626" font-weight="bold">(previous day)</text>
  <line x1="702" y1="190" x2="764" y2="190" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Flow band -->
  <rect x="80" y="330" width="940" height="100" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <rect x="110" y="355" width="250" height="50" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="235" y="385" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155" font-weight="bold">Store as Instant (UTC)</text>
  <line x1="364" y1="380" x2="418" y2="380" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <rect x="425" y="355" width="250" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="550" y="385" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e" font-weight="bold">convert with ZoneId</text>
  <line x1="679" y1="380" x2="733" y2="380" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <rect x="740" y="355" width="250" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="865" y="385" text-anchor="middle" font-family="Arial" font-size="14" fill="#166534" font-weight="bold">display as ZonedDateTime</text>
</svg>
