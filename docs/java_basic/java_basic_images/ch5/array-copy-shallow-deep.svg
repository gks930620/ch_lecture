<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Arial">
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1100" height="640" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-size="30" fill="#0f172a">Array Copy: Reference vs Shallow vs Deep</text>

  <!-- Column 1: reference copy -->
  <rect x="40" y="90" width="320" height="500" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b" font-family="Consolas, monospace">User[] b = a;</text>
  <text x="200" y="148" text-anchor="middle" font-size="14" fill="#991b1b">reference copy</text>

  <rect x="90" y="175" width="80" height="44" rx="10" fill="#ffffff" stroke="#dc2626"/>
  <text x="130" y="203" text-anchor="middle" font-size="15" fill="#991b1b" font-family="Consolas, monospace">a</text>
  <rect x="230" y="175" width="80" height="44" rx="10" fill="#ffffff" stroke="#dc2626"/>
  <text x="270" y="203" text-anchor="middle" font-size="15" fill="#991b1b" font-family="Consolas, monospace">b</text>

  <rect x="110" y="260" width="180" height="54" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <line x1="200" y1="260" x2="200" y2="314" stroke="#dc2626"/>
  <text x="155" y="292" text-anchor="middle" font-size="12" fill="#991b1b" font-family="Consolas, monospace">[0]</text>
  <text x="245" y="292" text-anchor="middle" font-size="12" fill="#991b1b" font-family="Consolas, monospace">[1]</text>

  <line x1="130" y1="221" x2="165" y2="258" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="270" y1="221" x2="235" y2="258" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="200" y="245" text-anchor="middle" font-size="12" fill="#991b1b">same array</text>

  <rect x="100" y="390" width="90" height="48" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="145" y="418" text-anchor="middle" font-size="13" fill="#991b1b">User#1</text>
  <rect x="210" y="390" width="90" height="48" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="255" y="418" text-anchor="middle" font-size="13" fill="#991b1b">User#2</text>

  <line x1="155" y1="316" x2="147" y2="388" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="245" y1="316" x2="253" y2="388" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

  <text x="200" y="490" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">one array, two names</text>
  <text x="200" y="514" text-anchor="middle" font-size="12" fill="#991b1b">b[0] change is visible via a</text>

  <!-- Column 2: shallow copy -->
  <rect x="390" y="90" width="320" height="500" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="550" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e" font-family="Consolas, monospace">b = a.clone();</text>
  <text x="550" y="148" text-anchor="middle" font-size="14" fill="#92400e">shallow copy (also Arrays.copyOf)</text>

  <rect x="430" y="175" width="80" height="44" rx="10" fill="#ffffff" stroke="#d97706"/>
  <text x="470" y="203" text-anchor="middle" font-size="15" fill="#92400e" font-family="Consolas, monospace">a</text>
  <rect x="590" y="175" width="80" height="44" rx="10" fill="#ffffff" stroke="#d97706"/>
  <text x="630" y="203" text-anchor="middle" font-size="15" fill="#92400e" font-family="Consolas, monospace">b</text>

  <rect x="405" y="260" width="130" height="54" rx="8" fill="#ffffff" stroke="#d97706"/>
  <line x1="470" y1="260" x2="470" y2="314" stroke="#d97706"/>
  <text x="437" y="292" text-anchor="middle" font-size="12" fill="#92400e" font-family="Consolas, monospace">[0]</text>
  <text x="502" y="292" text-anchor="middle" font-size="12" fill="#92400e" font-family="Consolas, monospace">[1]</text>

  <rect x="565" y="260" width="130" height="54" rx="8" fill="#ffffff" stroke="#d97706"/>
  <line x1="630" y1="260" x2="630" y2="314" stroke="#d97706"/>
  <text x="597" y="292" text-anchor="middle" font-size="12" fill="#92400e" font-family="Consolas, monospace">[0]</text>
  <text x="662" y="292" text-anchor="middle" font-size="12" fill="#92400e" font-family="Consolas, monospace">[1]</text>

  <line x1="470" y1="221" x2="470" y2="258" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="630" y1="221" x2="630" y2="258" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <rect x="420" y="390" width="90" height="48" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="465" y="418" text-anchor="middle" font-size="13" fill="#92400e">User#1</text>
  <rect x="590" y="390" width="90" height="48" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="635" y="418" text-anchor="middle" font-size="13" fill="#92400e">User#2</text>

  <line x1="437" y1="316" x2="455" y2="388" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="502" y1="316" x2="618" y2="388" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="597" y1="316" x2="480" y2="388" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="662" y1="316" x2="645" y2="388" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <text x="550" y="490" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">new array, same element objects</text>
  <text x="550" y="514" text-anchor="middle" font-size="12" fill="#92400e">b[0].setName() also affects a[0]</text>

  <!-- Column 3: deep copy -->
  <rect x="740" y="90" width="320" height="500" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="900" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">deep copy</text>
  <text x="900" y="148" text-anchor="middle" font-size="13" fill="#166534" font-family="Consolas, monospace">b[i] = new User(a[i]);</text>

  <rect x="780" y="175" width="80" height="44" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="820" y="203" text-anchor="middle" font-size="15" fill="#166534" font-family="Consolas, monospace">a</text>
  <rect x="940" y="175" width="80" height="44" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="980" y="203" text-anchor="middle" font-size="15" fill="#166534" font-family="Consolas, monospace">b</text>

  <rect x="755" y="260" width="130" height="54" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <line x1="820" y1="260" x2="820" y2="314" stroke="#16a34a"/>
  <text x="787" y="292" text-anchor="middle" font-size="12" fill="#166534" font-family="Consolas, monospace">[0]</text>
  <text x="852" y="292" text-anchor="middle" font-size="12" fill="#166534" font-family="Consolas, monospace">[1]</text>

  <rect x="915" y="260" width="130" height="54" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <line x1="980" y1="260" x2="980" y2="314" stroke="#16a34a"/>
  <text x="947" y="292" text-anchor="middle" font-size="12" fill="#166534" font-family="Consolas, monospace">[0]</text>
  <text x="1012" y="292" text-anchor="middle" font-size="12" fill="#166534" font-family="Consolas, monospace">[1]</text>

  <line x1="820" y1="221" x2="820" y2="258" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="980" y1="221" x2="980" y2="258" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="755" y="390" width="62" height="44" rx="8" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="786" y="416" text-anchor="middle" font-size="11" fill="#166534">User#1</text>
  <rect x="823" y="390" width="62" height="44" rx="8" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="854" y="416" text-anchor="middle" font-size="11" fill="#166534">User#2</text>
  <rect x="915" y="390" width="62" height="44" rx="8" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="946" y="416" text-anchor="middle" font-size="11" fill="#166534">User#1'</text>
  <rect x="983" y="390" width="62" height="44" rx="8" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="1014" y="416" text-anchor="middle" font-size="11" fill="#166534">User#2'</text>

  <line x1="787" y1="316" x2="786" y2="388" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="852" y1="316" x2="854" y2="388" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="947" y1="316" x2="946" y2="388" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="1012" y1="316" x2="1014" y2="388" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="900" y="490" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">new array, new objects</text>
  <text x="900" y="514" text-anchor="middle" font-size="12" fill="#166534">fully independent</text>
</svg>
