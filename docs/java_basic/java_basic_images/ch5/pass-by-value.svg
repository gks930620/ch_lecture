<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" font-family="Arial">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1100" height="570" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-size="30" fill="#0f172a">Java is always Pass-by-Value</text>

  <!-- Left panel: primitive -->
  <rect x="60" y="90" width="460" height="440" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="122" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a8a">primitive</text>

  <text x="150" y="168" text-anchor="middle" font-size="13" fill="#1e3a8a">caller</text>
  <text x="430" y="168" text-anchor="middle" font-size="13" fill="#1e3a8a">method(int x)</text>

  <rect x="80" y="178" width="140" height="64" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="150" y="216" text-anchor="middle" font-size="17" fill="#1e3a8a" font-family="Consolas, monospace">a = 10</text>

  <rect x="360" y="178" width="140" height="64" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="430" y="216" text-anchor="middle" font-size="17" fill="#1e3a8a" font-family="Consolas, monospace">x = 10</text>

  <line x1="222" y1="210" x2="358" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="290" y="200" text-anchor="middle" font-size="13" fill="#1e3a8a">copy of value</text>

  <line x1="430" y1="246" x2="430" y2="284" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="448" y="270" text-anchor="start" font-size="13" fill="#92400e" font-family="Consolas, monospace">x = 99;</text>
  <line x1="150" y1="246" x2="150" y2="284" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>

  <rect x="80" y="288" width="140" height="64" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="150" y="315" text-anchor="middle" font-size="17" fill="#1e3a8a" font-family="Consolas, monospace">a = 10</text>
  <text x="150" y="338" text-anchor="middle" font-size="12" fill="#1e3a8a">unchanged</text>

  <rect x="360" y="288" width="140" height="64" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="430" y="315" text-anchor="middle" font-size="17" fill="#92400e" font-family="Consolas, monospace">x = 99</text>
  <text x="430" y="338" text-anchor="middle" font-size="12" fill="#92400e">copy changed</text>

  <text x="290" y="410" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">a stays 10 — only the copy changed</text>
  <text x="290" y="450" text-anchor="middle" font-size="14" fill="#334155" font-family="Consolas, monospace">change(a); // a still 10</text>
  <text x="290" y="485" text-anchor="middle" font-size="13" fill="#334155">the value 10 is copied into x</text>

  <!-- Right panel: reference -->
  <rect x="580" y="90" width="460" height="440" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="810" y="122" text-anchor="middle" font-size="20" font-weight="bold" fill="#166534">reference</text>

  <text x="670" y="168" text-anchor="middle" font-size="13" fill="#166534">caller</text>
  <text x="950" y="168" text-anchor="middle" font-size="13" fill="#166534">method(User p)</text>

  <rect x="600" y="178" width="140" height="64" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="670" y="210" text-anchor="middle" font-size="17" fill="#166534" font-family="Consolas, monospace">u</text>
  <text x="670" y="232" text-anchor="middle" font-size="11" fill="#166534">(ref)</text>

  <rect x="880" y="178" width="140" height="64" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="950" y="210" text-anchor="middle" font-size="17" fill="#166534" font-family="Consolas, monospace">p</text>
  <text x="950" y="232" text-anchor="middle" font-size="11" fill="#166534">(ref)</text>

  <line x1="742" y1="210" x2="878" y2="210" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="810" y="200" text-anchor="middle" font-size="12" fill="#166534">copy of reference</text>

  <!-- Heap -->
  <rect x="640" y="285" width="340" height="125" rx="12" fill="none" stroke="#16a34a" stroke-dasharray="6 4"/>
  <text x="668" y="307" text-anchor="middle" font-size="13" fill="#166534">Heap</text>
  <rect x="700" y="315" width="220" height="80" rx="10" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="810" y="347" text-anchor="middle" font-size="15" fill="#166534">User object</text>
  <text x="810" y="371" text-anchor="middle" font-size="13" fill="#166534" font-family="Consolas, monospace">name = "Kim"</text>

  <line x1="670" y1="246" x2="762" y2="313" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="950" y1="246" x2="858" y2="313" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="810" y="442" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">both point to the same object</text>
  <text x="810" y="472" text-anchor="middle" font-size="13" fill="#92400e">p.setName(...) changes the shared object</text>
  <text x="810" y="496" text-anchor="middle" font-size="13" fill="#991b1b">p = new User() does NOT affect u</text>
</svg>
