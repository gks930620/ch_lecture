<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  </defs>

  <rect width="1100" height="540" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#0f172a">Race Condition: count++ is 3 steps</text>

  <!-- shared state + note -->
  <rect x="60" y="70" width="210" height="44" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="165" y="98" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#334155">shared: count = 10</text>
  <text x="680" y="98" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#334155">count++ = read &#8594; add &#8594; write (3 steps, not atomic)</text>

  <!-- lane baselines -->
  <line x1="190" y1="185" x2="1060" y2="185" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="190" y1="305" x2="1060" y2="305" stroke="#cbd5e1" stroke-width="2"/>

  <!-- thread labels -->
  <rect x="45" y="160" width="125" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="107" y="191" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e3a8a">Thread A</text>
  <rect x="45" y="280" width="125" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="107" y="311" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#166534">Thread B</text>

  <!-- Thread A events -->
  <rect x="190" y="162" width="120" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="191" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e3a8a">read 10</text>
  <rect x="340" y="162" width="120" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="191" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e3a8a">add 1 &#8594; 11</text>
  <rect x="640" y="162" width="120" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="191" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e3a8a">write 11</text>
  <line x1="312" y1="185" x2="336" y2="185" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="462" y1="185" x2="636" y2="185" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Thread B events -->
  <rect x="340" y="282" width="120" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="311" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#166534">read 10</text>
  <rect x="490" y="282" width="120" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="311" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#166534">add 1 &#8594; 11</text>
  <rect x="770" y="282" width="120" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="830" y="311" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#166534">write 11</text>
  <line x1="462" y1="305" x2="486" y2="305" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="612" y1="305" x2="766" y2="305" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- interleaving note -->
  <text x="430" y="252" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#d97706">A hasn't written yet &#8594; B also reads stale 10</text>

  <!-- result -->
  <rect x="910" y="200" width="160" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="990" y="238" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#991b1b">count = 11</text>
  <text x="990" y="266" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#991b1b">not 12!</text>
  <line x1="764" y1="185" x2="906" y2="225" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="894" y1="302" x2="946" y2="293" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- time axis -->
  <line x1="190" y1="370" x2="1060" y2="370" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="620" y="392" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">time</text>

  <!-- bottom band -->
  <rect x="90" y="430" width="920" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="550" y="458" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#92400e">two increments, but count only went +1</text>
  <text x="550" y="484" text-anchor="middle" font-family="Arial" font-size="15" fill="#92400e">fix: synchronized block or AtomicInteger.incrementAndGet()</text>
</svg>
