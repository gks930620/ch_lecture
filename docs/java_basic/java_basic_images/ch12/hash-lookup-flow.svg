<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
  </defs>

  <rect width="1100" height="560" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#0f172a">How HashMap/HashSet Finds an Entry</text>

  <!-- key object -->
  <rect x="40" y="180" width="160" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="212" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e3a8a">key object</text>
  <text x="120" y="240" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#1e3a8a">"apple"</text>

  <!-- hashCode arrow -->
  <line x1="204" y1="220" x2="304" y2="243" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="252" y="205" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e3a8a">hashCode()</text>

  <!-- bucket array -->
  <text x="375" y="125" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#334155">bucket array</text>
  <rect x="310" y="140" width="130" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="322" y="167" font-family="Consolas, monospace" font-size="14" fill="#334155">[0]</text>
  <rect x="310" y="182" width="130" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="322" y="209" font-family="Consolas, monospace" font-size="14" fill="#334155">[1]</text>
  <rect x="310" y="224" width="130" height="42" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="322" y="251" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#92400e">[2]</text>
  <rect x="310" y="266" width="130" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="322" y="293" font-family="Consolas, monospace" font-size="14" fill="#334155">[3]</text>
  <rect x="310" y="308" width="130" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="322" y="335" font-family="Consolas, monospace" font-size="14" fill="#334155">[4]</text>
  <rect x="310" y="350" width="130" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="322" y="377" font-family="Consolas, monospace" font-size="14" fill="#334155">[5]</text>
  <text x="375" y="418" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#334155">index = hash % capacity</text>

  <!-- bucket -> entries -->
  <line x1="444" y1="245" x2="514" y2="209" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- entries in bucket -->
  <text x="620" y="160" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#334155">entries in bucket [2]</text>
  <rect x="520" y="180" width="200" height="52" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="620" y="212" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#334155">"banana" : 3</text>
  <rect x="520" y="280" width="200" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="312" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#166534">"apple" : 5</text>
  <line x1="620" y1="236" x2="620" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="632" y="260" font-family="Consolas, monospace" font-size="12" fill="#64748b">next</text>

  <!-- equals false -->
  <line x1="724" y1="206" x2="790" y2="206" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <text x="800" y="211" font-family="Consolas, monospace" font-size="13" fill="#991b1b">equals() false &#8594; check next</text>

  <!-- equals true -> match -->
  <line x1="724" y1="306" x2="826" y2="306" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="775" y="290" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">equals() true</text>

  <rect x="830" y="266" width="230" height="80" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="945" y="300" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#166534">match found</text>
  <text x="945" y="326" text-anchor="middle" font-family="Arial" font-size="14" fill="#166534">value returned</text>

  <!-- pitfall band -->
  <rect x="50" y="460" width="1000" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="550" y="488" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#991b1b">Pitfall: hashCode() / equals() not overridden</text>
  <text x="550" y="514" text-anchor="middle" font-family="Arial" font-size="15" fill="#991b1b">same key content &#8594; different bucket &#8594; duplicate stored / entry never found</text>
</svg>
