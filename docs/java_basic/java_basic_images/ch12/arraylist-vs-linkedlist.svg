<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660">
  <defs>
    <marker id="arrowGreen3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker>
  </defs>
  <rect width="1100" height="660" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="30" fill="#0f172a" font-weight="bold">ArrayList vs LinkedList — Internal Structure</text>

  <!-- Top panel: ArrayList (blue) -->
  <rect x="40" y="70" width="1020" height="240" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="550" y="102" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1e3a8a">ArrayList — contiguous array</text>

  <!-- shift arrows above cells 2..4 -->
  <line x1="480" y1="120" x2="520" y2="120" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <line x1="570" y1="120" x2="610" y2="120" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <line x1="660" y1="120" x2="700" y2="120" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- cells -->
  <rect x="325" y="130" width="90" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="415" y="130" width="90" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="505" y="130" width="90" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="595" y="130" width="90" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="685" y="130" width="90" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="370" y="166" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1e3a8a">A</text>
  <text x="460" y="166" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1e3a8a">B</text>
  <text x="550" y="166" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1e3a8a">C</text>
  <text x="640" y="166" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1e3a8a">D</text>
  <text x="730" y="166" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1e3a8a">E</text>
  <text x="370" y="208" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e3a8a">[0]</text>
  <text x="460" y="208" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e3a8a">[1]</text>
  <text x="550" y="208" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e3a8a">[2]</text>
  <text x="640" y="208" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e3a8a">[3]</text>
  <text x="730" y="208" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e3a8a">[4]</text>

  <!-- pointer arrows from labels to cells -->
  <line x1="330" y1="242" x2="620" y2="218" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen3)"/>
  <line x1="770" y1="242" x2="478" y2="218" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- labels -->
  <rect x="75" y="246" width="440" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="295" y="272" text-anchor="middle" font-family="Arial" font-size="16" fill="#166534">get(3): jump directly by index — O(1)</text>
  <rect x="565" y="246" width="460" height="40" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="795" y="272" text-anchor="middle" font-family="Arial" font-size="16" fill="#92400e">insert at 1: shift elements right →</text>

  <!-- Bottom panel: LinkedList (green) -->
  <rect x="40" y="335" width="1020" height="235" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="367" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#166534">LinkedList — chain of nodes</text>

  <!-- nodes -->
  <text x="265" y="395" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#166534">head</text>
  <rect x="200" y="402" width="130" height="58" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="265" y="438" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#166534">A</text>
  <rect x="390" y="402" width="130" height="58" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="455" y="438" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#166534">B</text>
  <rect x="580" y="402" width="130" height="58" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="438" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#166534">C</text>
  <rect x="770" y="402" width="130" height="58" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="835" y="438" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#166534">D</text>

  <!-- next arrows -->
  <line x1="330" y1="431" x2="384" y2="431" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen3)"/>
  <text x="357" y="420" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">next</text>
  <line x1="520" y1="431" x2="574" y2="431" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen3)"/>
  <text x="547" y="420" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">next</text>
  <line x1="710" y1="431" x2="764" y2="431" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen3)"/>
  <text x="737" y="420" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">next</text>

  <!-- walk hops (dashed amber) -->
  <path d="M265,466 Q360,496 455,466" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowAmber)"/>
  <path d="M455,466 Q550,496 645,466" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowAmber)"/>
  <path d="M645,466 Q740,496 835,466" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowAmber)"/>

  <!-- labels -->
  <rect x="75" y="510" width="400" height="40" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="275" y="536" text-anchor="middle" font-family="Arial" font-size="16" fill="#92400e">get(3): walk node by node — O(n)</text>
  <rect x="525" y="510" width="500" height="40" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="775" y="536" text-anchor="middle" font-family="Arial" font-size="15" fill="#166534">insert: relink neighbors, but must walk there first</text>

  <!-- conclusion band (gray) -->
  <rect x="100" y="595" width="900" height="46" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="550" y="624" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">Default choice: ArrayList. LinkedList fits queue/deque (both ends).</text>
</svg>
