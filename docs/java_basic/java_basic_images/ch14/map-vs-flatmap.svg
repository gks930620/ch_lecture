<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  </defs>

  <rect width="1100" height="620" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#0f172a">map vs flatMap</text>

  <!-- common input -->
  <text x="550" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#334155">input: Stream&lt;List&lt;String&gt;&gt;</text>
  <rect x="330" y="95" width="440" height="70" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <rect x="355" y="108" width="120" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="415" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#1e3a8a">[a, b]</text>
  <rect x="490" y="108" width="120" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="550" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#1e3a8a">[c]</text>
  <rect x="625" y="108" width="120" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="685" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#1e3a8a">[d, e]</text>

  <!-- arrows into panels -->
  <line x1="550" y1="168" x2="550" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <path d="M330,130 C110,130 100,300 100,480 L164,480" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- map panel -->
  <rect x="170" y="200" width="890" height="175" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="195" y="240" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#92400e">map(List::stream)</text>
  <text x="195" y="266" font-family="Arial" font-size="13" fill="#92400e">result:</text>
  <text x="195" y="288" font-family="Consolas, monospace" font-size="14" fill="#92400e">Stream&lt;Stream&lt;String&gt;&gt;</text>
  <rect x="440" y="222" width="590" height="100" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="465" y="244" width="170" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="550" y="266" text-anchor="middle" font-family="Arial" font-size="12" fill="#92400e">Stream</text>
  <text x="550" y="288" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#92400e">a, b</text>
  <rect x="650" y="244" width="170" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="735" y="266" text-anchor="middle" font-family="Arial" font-size="12" fill="#92400e">Stream</text>
  <text x="735" y="288" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#92400e">c</text>
  <rect x="835" y="244" width="170" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="920" y="266" text-anchor="middle" font-family="Arial" font-size="12" fill="#92400e">Stream</text>
  <text x="920" y="288" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#92400e">d, e</text>
  <text x="735" y="352" text-anchor="middle" font-family="Arial" font-size="15" font-style="italic" fill="#92400e">stream of streams &#8212; hard to use</text>

  <!-- flatMap panel -->
  <rect x="170" y="405" width="890" height="175" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="195" y="445" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#166534">flatMap(List::stream)</text>
  <text x="195" y="471" font-family="Arial" font-size="13" fill="#166534">result:</text>
  <text x="195" y="493" font-family="Consolas, monospace" font-size="14" fill="#166534">Stream&lt;String&gt;</text>
  <rect x="470" y="427" width="530" height="90" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="535" y="448" width="64" height="48" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="567" y="479" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#166534">a</text>
  <rect x="619" y="448" width="64" height="48" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="651" y="479" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#166534">b</text>
  <rect x="703" y="448" width="64" height="48" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="735" y="479" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#166534">c</text>
  <rect x="787" y="448" width="64" height="48" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="819" y="479" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#166534">d</text>
  <rect x="871" y="448" width="64" height="48" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="903" y="479" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#166534">e</text>
  <text x="735" y="550" text-anchor="middle" font-family="Arial" font-size="15" font-style="italic" fill="#166534">flattened into one stream</text>
</svg>
