<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680">
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
  </defs>

  <rect width="1100" height="680" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="30" fill="#0f172a" font-weight="bold">Dependency Inversion (DIP)</text>

  <!-- Bad panel -->
  <rect x="60" y="70" width="980" height="215" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="90" y="102" font-family="Arial" font-size="20" fill="#991b1b" font-weight="bold">Bad: depends on concrete class</text>

  <rect x="140" y="135" width="240" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="177" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#1e3a8a" font-weight="bold">OrderService</text>

  <text x="515" y="155" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#991b1b">new CardPaymentService()</text>
  <line x1="382" y1="170" x2="642" y2="170" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>

  <rect x="650" y="135" width="310" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="805" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#991b1b" font-weight="bold">CardPaymentService</text>
  <text x="805" y="190" text-anchor="middle" font-family="Arial" font-size="13" fill="#991b1b">(concrete class)</text>

  <text x="550" y="252" text-anchor="middle" font-family="Arial" font-size="15" fill="#991b1b" font-weight="bold">adding KakaoPay = modify OrderService</text>

  <!-- Good panel -->
  <rect x="60" y="315" width="980" height="335" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="90" y="347" font-family="Arial" font-size="20" fill="#166534" font-weight="bold">Good: depends on interface</text>

  <rect x="120" y="385" width="240" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="427" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#1e3a8a" font-weight="bold">OrderService</text>

  <text x="478" y="408" text-anchor="middle" font-family="Arial" font-size="13" fill="#166534">depends on</text>
  <line x1="362" y1="420" x2="592" y2="420" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <rect x="600" y="385" width="310" height="70" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="755" y="416" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#166534" font-weight="bold">PaymentService</text>
  <text x="755" y="440" text-anchor="middle" font-family="Arial" font-size="13" fill="#166534">&#171;interface&#187;</text>

  <!-- implementations -->
  <line x1="515" y1="543" x2="678" y2="462" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <line x1="705" y1="543" x2="750" y2="462" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <line x1="905" y1="543" x2="832" y2="462" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <text x="415" y="510" text-anchor="middle" font-family="Arial" font-size="13" fill="#166534" font-style="italic">implements</text>

  <rect x="430" y="545" width="170" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="515" y="581" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#166534">CardPayment</text>

  <rect x="630" y="545" width="150" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="705" y="581" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#166534">KakaoPay</text>

  <rect x="810" y="545" width="190" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="905" y="571" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#166534">FakePayment</text>
  <text x="905" y="592" text-anchor="middle" font-family="Arial" font-size="12" fill="#166534">(for tests)</text>

  <text x="550" y="636" text-anchor="middle" font-family="Arial" font-size="15" fill="#166534" font-weight="bold">add new payment without touching OrderService</text>
</svg>
