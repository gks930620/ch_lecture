<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">이벤트 루프 (Event Loop)</text>

  <!-- Call Stack -->
  <rect x="40" y="70" width="200" height="150" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">Call Stack</text>
  <text x="140" y="116" text-anchor="middle" font-size="12" fill="#475569">지금 실행 중인 함수</text>
  <rect x="60" y="130" width="160" height="26" rx="4" fill="#93c5fd"/>
  <text x="140" y="148" text-anchor="middle" font-size="12" fill="#1e3a8a">console.log(...)</text>
  <rect x="60" y="162" width="160" height="26" rx="4" fill="#bfdbfe"/>
  <text x="140" y="180" text-anchor="middle" font-size="12" fill="#1e3a8a">main()</text>

  <!-- Web APIs -->
  <rect x="520" y="70" width="200" height="150" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="620" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">Web APIs</text>
  <text x="620" y="120" text-anchor="middle" font-size="12" fill="#92400e">setTimeout</text>
  <text x="620" y="142" text-anchor="middle" font-size="12" fill="#92400e">fetch</text>
  <text x="620" y="164" text-anchor="middle" font-size="12" fill="#92400e">DOM 이벤트</text>
  <text x="620" y="196" text-anchor="middle" font-size="11" fill="#a16207">(오래 걸리는 작업 위임)</text>

  <!-- arrow call stack -> web apis -->
  <path d="M245 120 H515" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="380" y="112" text-anchor="middle" font-size="11" fill="#64748b">작업 위임</text>

  <!-- Microtask Queue -->
  <rect x="420" y="260" width="300" height="54" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="435" y="285" font-size="14" font-weight="700" fill="#15803d">① Microtask Queue</text>
  <text x="435" y="304" font-size="11" fill="#166534">Promise .then / await  ← 우선순위 높음</text>

  <!-- Macrotask Queue -->
  <rect x="420" y="326" width="300" height="54" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="435" y="351" font-size="14" font-weight="700" fill="#b91c1c">② Macrotask Queue</text>
  <text x="435" y="370" font-size="11" fill="#991b1b">setTimeout / 이벤트  ← 우선순위 낮음</text>

  <!-- web apis -> queues -->
  <path d="M620 225 V240 H570 V255" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="600" y="248" font-size="11" fill="#64748b">완료 콜백</text>

  <!-- Event Loop circle -->
  <circle cx="200" cy="330" r="70" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="200" y="325" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">Event Loop</text>
  <text x="200" y="347" text-anchor="middle" font-size="11" fill="#5b21b6">Stack이 비면</text>
  <text x="200" y="363" text-anchor="middle" font-size="11" fill="#5b21b6">큐에서 꺼냄</text>

  <!-- queue -> event loop -->
  <path d="M415 353 H290 Q270 353 270 335" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ar)"/>
  <!-- event loop -> call stack -->
  <path d="M180 262 Q170 200 150 226" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ar)"/>
  <text x="120" y="250" font-size="11" fill="#7c3aed">실행</text>

  <text x="380" y="430" text-anchor="middle" font-size="13" fill="#334155">실행 순서: <tspan font-weight="700" fill="#1e40af">동기</tspan> → <tspan font-weight="700" fill="#15803d">마이크로태스크</tspan> → <tspan font-weight="700" fill="#b91c1c">매크로태스크</tspan></text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
