<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect width="720" height="380" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">CORS Preflight (사전 요청) 흐름</text>

  <!-- actors -->
  <rect x="60" y="66" width="180" height="46" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">브라우저 (mysite.com)</text>

  <rect x="480" y="66" width="180" height="46" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="570" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">서버 (api.example.com)</text>

  <line x1="150" y1="112" x2="150" y2="350" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="570" y1="112" x2="570" y2="350" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- preflight -->
  <text x="360" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">① Preflight (자동 발생: PUT/DELETE, 커스텀 헤더 등)</text>
  <path d="M152 150 H568" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="166" text-anchor="middle" font-size="11" fill="#92400e" font-family="monospace">OPTIONS  (Origin, Access-Control-Request-Method)</text>

  <path d="M568 190 H152" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="184" text-anchor="middle" font-size="11" fill="#166534" font-family="monospace">200  Access-Control-Allow-Origin / -Methods</text>

  <!-- decision -->
  <rect x="250" y="204" width="220" height="40" rx="8" fill="#fff" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="360" y="229" text-anchor="middle" font-size="12" fill="#334155">허용 헤더 확인 → 통과하면 본요청 진행</text>

  <!-- actual request -->
  <text x="360" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">② 실제 요청</text>
  <path d="M152 282 H568" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="298" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="monospace">PUT /data  (실제 데이터)</text>

  <path d="M568 322 H152" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="316" text-anchor="middle" font-size="11" fill="#166534" font-family="monospace">200  응답 + Access-Control-Allow-Origin</text>

  <text x="360" y="352" text-anchor="middle" font-size="11" fill="#dc2626">※ Allow-Origin 헤더가 없거나 안 맞으면 브라우저가 응답을 차단 (CORS 에러)</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
