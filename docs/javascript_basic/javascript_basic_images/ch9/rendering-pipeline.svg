<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect width="760" height="320" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">브라우저 렌더링 파이프라인</text>

  <!-- Stage boxes -->
  <g>
    <rect x="30" y="70" width="120" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">DOM</text>
    <text x="90" y="120" text-anchor="middle" font-size="11" fill="#475569">HTML 파싱</text>

    <rect x="30" y="160" width="120" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">CSSOM</text>
    <text x="90" y="210" text-anchor="middle" font-size="11" fill="#475569">CSS 파싱</text>

    <rect x="200" y="115" width="120" height="70" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="260" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Render Tree</text>
    <text x="260" y="165" text-anchor="middle" font-size="11" fill="#166534">보이는 것만</text>

    <rect x="370" y="115" width="120" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="430" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Layout</text>
    <text x="430" y="165" text-anchor="middle" font-size="11" fill="#92400e">위치·크기 계산</text>

    <rect x="520" y="115" width="120" height="70" rx="10" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2"/>
    <text x="580" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#be123c">Paint</text>
    <text x="580" y="165" text-anchor="middle" font-size="11" fill="#9f1239">픽셀 색칠</text>

    <rect x="660" y="115" width="80" height="70" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="700" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Composite</text>
    <text x="700" y="165" text-anchor="middle" font-size="11" fill="#5b21b6">합성</text>
  </g>

  <!-- arrows -->
  <path d="M152 105 L198 135" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M152 195 L198 165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M322 150 H368" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M492 150 H518" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M642 150 H658" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- reflow/repaint notes -->
  <rect x="200" y="220" width="440" height="80" rx="10" fill="#fff" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="220" y="246" font-size="13" font-weight="700" fill="#b45309">🔁 리플로우(Reflow):</text>
  <text x="360" y="246" font-size="12" fill="#475569">Layout부터 다시 → 비쌈 (width, position 등)</text>
  <text x="220" y="272" font-size="13" font-weight="700" fill="#be123c">🎨 리페인트(Repaint):</text>
  <text x="360" y="272" font-size="12" fill="#475569">Paint만 다시 (color, background 등)</text>
  <text x="220" y="294" font-size="12" font-weight="700" fill="#6d28d9">⚡ transform / opacity:</text>
  <text x="360" y="294" font-size="12" fill="#475569">합성 단계만 → 가장 빠름 (별도 레이어일 때)</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
