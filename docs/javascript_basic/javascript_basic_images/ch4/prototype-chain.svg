<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">프로토타입 체인 (Prototype Chain)</text>
  <text x="360" y="60" text-anchor="middle" font-size="13" fill="#64748b">const arr = [1, 2, 3];  →  없는 속성은 위로 올라가며 찾습니다</text>

  <!-- arr -->
  <rect x="270" y="86" width="180" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="360" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">arr  [1, 2, 3]</text>
  <text x="360" y="132" text-anchor="middle" font-size="11" fill="#475569">실제 데이터 (인스턴스)</text>

  <!-- Array.prototype -->
  <rect x="240" y="186" width="240" height="66" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="360" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Array.prototype</text>
  <text x="360" y="230" text-anchor="middle" font-size="11" fill="#166534">push, pop, map, join,</text>
  <text x="360" y="245" text-anchor="middle" font-size="11" fill="#166534">toString(오버라이드) …</text>

  <!-- Object.prototype -->
  <rect x="240" y="292" width="240" height="66" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="316" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Object.prototype</text>
  <text x="360" y="336" text-anchor="middle" font-size="11" fill="#92400e">hasOwnProperty,</text>
  <text x="360" y="351" text-anchor="middle" font-size="11" fill="#92400e">toString(원본) …</text>

  <!-- null -->
  <rect x="315" y="384" width="90" height="30" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">null</text>

  <!-- arrows -->
  <path d="M360 148 V184" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M360 254 V290" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M360 360 V382" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="172" font-size="11" fill="#64748b">__proto__</text>
  <text x="470" y="278" font-size="11" fill="#64748b">__proto__</text>
  <text x="470" y="376" font-size="11" fill="#64748b">체인의 끝</text>

  <!-- lookup example -->
  <rect x="500" y="120" width="200" height="150" rx="10" fill="#fff" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="600" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">arr.push() 를 찾는 순서</text>
  <text x="514" y="170" font-size="12" fill="#1e40af">① arr 자신에 있나? ❌</text>
  <text x="514" y="194" font-size="12" fill="#15803d">② Array.prototype? ✅ 발견!</text>
  <text x="514" y="224" font-size="11" fill="#64748b">arr.hasOwnProperty()는</text>
  <text x="514" y="240" font-size="11" fill="#64748b">①❌ ②❌ 를 지나</text>
  <text x="514" y="256" font-size="11" fill="#b45309">③ Object.prototype에서 발견</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
