<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <rect width="960" height="440" fill="#f8fafc"/>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-family="Arial" fill="#0f172a" font-weight="bold">웹 페이지의 3요소 = 집 짓기 비유</text>

  <!-- HTML = 뼈대 -->
  <g>
    <text x="180" y="96" text-anchor="middle" font-size="20" font-family="Arial" fill="#1d4ed8" font-weight="bold">HTML = 뼈대</text>
    <!-- house frame -->
    <polygon points="180,130 90,205 270,205" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <rect x="110" y="205" width="140" height="130" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <line x1="110" y1="270" x2="250" y2="270" stroke="#1d4ed8" stroke-width="3"/>
    <line x1="180" y1="205" x2="180" y2="335" stroke="#1d4ed8" stroke-width="3"/>
    <text x="180" y="372" text-anchor="middle" font-size="14" font-family="Arial" fill="#1e3a8a">구조 · 뼈대를 세운다</text>
  </g>

  <!-- CSS = 인테리어 -->
  <g>
    <text x="480" y="96" text-anchor="middle" font-size="20" font-family="Arial" fill="#16a34a" font-weight="bold">CSS = 인테리어</text>
    <polygon points="480,130 390,205 570,205" fill="#bbf7d0" stroke="#16a34a" stroke-width="4"/>
    <rect x="410" y="205" width="140" height="130" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <rect x="430" y="230" width="45" height="45" fill="#86efac" stroke="#15803d" stroke-width="2"/>
    <rect x="490" y="230" width="45" height="45" fill="#86efac" stroke="#15803d" stroke-width="2"/>
    <rect x="460" y="295" width="40" height="40" fill="#15803d"/>
    <text x="480" y="372" text-anchor="middle" font-size="14" font-family="Arial" fill="#166534">색·모양으로 꾸민다</text>
  </g>

  <!-- JS = 가전 -->
  <g>
    <text x="780" y="96" text-anchor="middle" font-size="20" font-family="Arial" fill="#d97706" font-weight="bold">JavaScript = 가전</text>
    <polygon points="780,130 690,205 870,205" fill="#fde68a" stroke="#d97706" stroke-width="4"/>
    <rect x="710" y="205" width="140" height="130" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <!-- switch/lightning = 동작 -->
    <polygon points="792,225 762,285 785,285 772,320 812,255 787,255" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <text x="780" y="372" text-anchor="middle" font-size="14" font-family="Arial" fill="#92400e">움직이게 만든다</text>
  </g>

  <text x="480" y="418" text-anchor="middle" font-size="16" font-family="Arial" fill="#334155">HTML로 뼈대를 세우고 → CSS로 꾸미고 → JS로 기능을 넣는다</text>
</svg>
