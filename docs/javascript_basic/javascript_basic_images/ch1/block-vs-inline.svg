<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <rect width="960" height="440" fill="#f8fafc"/>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-family="Arial" fill="#0f172a" font-weight="bold">블록 요소 vs 인라인 요소</text>

  <!-- Block side -->
  <text x="250" y="92" text-anchor="middle" font-size="20" font-family="Arial" fill="#1d4ed8" font-weight="bold">블록 (예: &lt;div&gt;)</text>
  <text x="250" y="116" text-anchor="middle" font-size="14" font-family="Arial" fill="#64748b">한 줄을 통째로 차지 → 세로로 쌓임</text>

  <rect x="60" y="140" width="380" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="250" y="171" text-anchor="middle" font-size="15" font-family="Arial" fill="#1e3a8a">div 1 (가로 폭 전체)</text>
  <rect x="60" y="200" width="380" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="250" y="231" text-anchor="middle" font-size="15" font-family="Arial" fill="#1e3a8a">div 2 (다음 줄로 내려감)</text>
  <rect x="60" y="260" width="380" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="250" y="291" text-anchor="middle" font-size="15" font-family="Arial" fill="#1e3a8a">div 3</text>

  <!-- divider -->
  <line x1="480" y1="80" x2="480" y2="360" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Inline side -->
  <text x="710" y="92" text-anchor="middle" font-size="20" font-family="Arial" fill="#16a34a" font-weight="bold">인라인 (예: &lt;span&gt;)</text>
  <text x="710" y="116" text-anchor="middle" font-size="14" font-family="Arial" fill="#64748b">콘텐츠 크기만큼만 → 옆으로 나란히</text>

  <rect x="520" y="140" width="120" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="171" text-anchor="middle" font-size="15" font-family="Arial" fill="#166534">span 1</text>
  <rect x="648" y="140" width="120" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="708" y="171" text-anchor="middle" font-size="15" font-family="Arial" fill="#166534">span 2</text>
  <rect x="776" y="140" width="120" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="836" y="171" text-anchor="middle" font-size="15" font-family="Arial" fill="#166534">span 3</text>
  <text x="710" y="230" text-anchor="middle" font-size="14" font-family="Arial" fill="#166534">공간이 부족하면 그때 다음 줄로 넘어감</text>

  <text x="480" y="400" text-anchor="middle" font-size="16" font-family="Arial" fill="#334155">블록은 "문단·구역"을, 인라인은 "문장 속 일부"를 감쌀 때 쓴다</text>
</svg>
