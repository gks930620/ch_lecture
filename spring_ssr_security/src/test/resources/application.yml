# ==========================================
# 테스트 전용 설정 (src/test/resources)
# ==========================================
# 테스트 실행 시 main의 application.yml 대신 이 파일이 우선 적용된다.
# 이 프로젝트(Spring Security 세션 로그인)에 맞는 최소 설정만 둔다.
spring:
  datasource:
    url: jdbc:mariadb://localhost:3406/test    # main과 동일한 개발용 test DB 사용
    username: test
    password: test
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      connection-init-sql: SET FOREIGN_KEY_CHECKS = 0

  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트 시작 시 생성, 종료 시 삭제
    defer-datasource-initialization: true   # 테이블 생성 후 data-*.sql 실행
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  # 이 프로젝트에 실제 존재하는 SQL만 로드 (사용자 초기 데이터)
  sql:
    init:
      mode: always
      data-locations:
        - classpath:data-users.sql
