<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect width="1600" height="8" fill="#1d4ed8"/>
  <text x="60" y="52" font-size="15" letter-spacing="3" fill="#64748b" font-weight="bold">CH LECTURE</text>
  <text x="1540" y="52" font-size="15" fill="#94a3b8" text-anchor="end" font-weight="bold">01 / 06</text>

  <!-- headline -->
  <text x="800" y="150" text-anchor="middle" font-size="26" fill="#b91c1c" font-weight="bold">비전공자 · 노베이스 환영</text>
  <text x="800" y="228" text-anchor="middle" font-size="58" font-weight="bold" fill="#0f172a">설명이 아니라,</text>
  <text x="800" y="300" text-anchor="middle" font-size="58" font-weight="bold" fill="#0f172a">구현으로 완성하는 실전 웹개발</text>
  <text x="800" y="352" text-anchor="middle" font-size="21" fill="#475569">기초 문법부터 실제 서비스 배포까지 — 1:1로 끝까지 완주합니다</text>

  <!-- chips -->
  <g font-size="17" font-weight="bold">
    <rect x="490" y="386" width="180" height="42" rx="21" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="580" y="413" text-anchor="middle" fill="#1e3a8a">1:1 대면 수업</text>
    <rect x="700" y="386" width="200" height="42" rx="21" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="800" y="413" text-anchor="middle" fill="#14532d">매 회차 결과물</text>
    <rect x="930" y="386" width="210" height="42" rx="21" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
    <text x="1035" y="413" text-anchor="middle" fill="#881337">실서비스 배포까지</text>
  </g>

  <!-- caption -->
  <text x="800" y="482" text-anchor="middle" font-size="18" fill="#334155" font-weight="bold">수강이 끝나면, 이런 서비스를 "직접" 만들어 배포합니다</text>

  <!-- browser mockup -->
  <g>
    <rect x="400" y="500" width="800" height="330" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <path d="M400 550 h800 v-36 a14 14 0 0 0 -14 -14 h-772 a14 14 0 0 0 -14 14 z" fill="#e2e8f0"/>
    <circle cx="428" cy="525" r="6" fill="#f87171"/>
    <circle cx="450" cy="525" r="6" fill="#fbbf24"/>
    <circle cx="472" cy="525" r="6" fill="#34d399"/>
    <rect x="500" y="512" width="560" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="516" y="530" font-size="14" fill="#64748b">https://my-service.up.railway.app</text>

    <!-- nav -->
    <text x="432" y="590" font-size="18" font-weight="bold" fill="#0f172a">MY COMMUNITY</text>
    <rect x="880" y="570" width="82" height="30" rx="15" fill="#eef2ff" stroke="#6366f1"/>
    <text x="921" y="590" text-anchor="middle" font-size="14" fill="#4338ca">게시판</text>
    <rect x="972" y="570" width="70" height="30" rx="15" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="1007" y="590" text-anchor="middle" font-size="14" fill="#115e59">채팅</text>
    <rect x="1052" y="570" width="116" height="30" rx="15" fill="#fff1f2" stroke="#e11d48"/>
    <text x="1110" y="590" text-anchor="middle" font-size="14" fill="#9f1239">카카오 로그인</text>

    <!-- board list -->
    <rect x="432" y="620" width="440" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="448" y="642" font-size="14" font-weight="bold" fill="#334155">오늘 배포 성공한 후기 공유합니다</text>
    <text x="448" y="662" font-size="12" fill="#94a3b8">글 · 댓글 3 · 파일 1</text>
    <rect x="432" y="682" width="440" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="448" y="704" font-size="14" font-weight="bold" fill="#334155">파일 업로드 + 페이징/검색 구현 완료</text>
    <text x="448" y="724" font-size="12" fill="#94a3b8">글 · 댓글 5</text>
    <rect x="432" y="744" width="440" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="448" y="766" font-size="14" font-weight="bold" fill="#334155">JWT 로그인 붙였습니다</text>
    <text x="448" y="786" font-size="12" fill="#94a3b8">글 · 댓글 2</text>

    <!-- chat panel -->
    <rect x="896" y="620" width="272" height="176" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="912" y="644" font-size="13" font-weight="bold" fill="#115e59">실시간 채팅 (STOMP)</text>
    <rect x="912" y="656" width="170" height="30" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="924" y="676" font-size="13" fill="#334155">배포 어디까지 했어?</text>
    <rect x="978" y="694" width="176" height="30" rx="12" fill="#0d9488"/>
    <text x="990" y="714" font-size="13" fill="#ffffff">방금 Docker로 올렸어!</text>
    <rect x="912" y="732" width="140" height="30" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="924" y="752" font-size="13" fill="#334155">URL 공유해줘</text>
  </g>

  <text x="800" y="872" text-anchor="middle" font-size="15" fill="#64748b">Java · SQL · HTML/CSS · JavaScript · Spring Boot · Security · JWT · WebSocket · Docker</text>
</svg>
